<div class="component-wrapper">
  <div class="component-header">
    <h2 class="component-title">Create Customer</h2>
    <p class="component-desc">Register a new customer in the system.</p>
  </div>

  <div class="form-card">
    <div class="form-grid">
      <div class="form-group">
        <label>Full Name</label>
        <input [(ngModel)]="form.name" placeholder="e.g. James Sathyaraj" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input [(ngModel)]="form.email" type="email" placeholder="e.g. james@gmail.com" />
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input [(ngModel)]="form.phone" placeholder="10-digit number" />
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input [(ngModel)]="form.dateOfBirth" type="date" />
      </div>
      <div class="form-group">
        <label>Aadhaar Number</label>
        <input [(ngModel)]="form.aadhaar" placeholder="12-digit Aadhaar" />
      </div>
      <div class="form-group">
        <label>PAN Number</label>
        <input [(ngModel)]="form.pan" placeholder="e.g. ABCDE1234F" />
      </div>
    </div>
    <div class="form-group">
      <label>KYC Status</label>
      <select [(ngModel)]="form.kycStatus">
        <option [ngValue]="true">Verified</option>
        <option [ngValue]="false">Not Verified</option>
      </select>
    </div>
    <div class="form-actions">
      <button class="btn-primary" (click)="submit()" [disabled]="loading()">
        {{ loading() ? 'Creating...' : 'Create Customer' }}
      </button>
      <button class="btn-secondary" (click)="reset()">Reset</button>
    </div>
  </div>

  <div class="result-card success" *ngIf="result()">
    <p class="result-title">Customer Created Successfully</p>
    <p class="result-message">{{ result().message }}</p>
  </div>

  <div class="result-card error" *ngIf="error()">
    <p class="result-title">Error Creating Customer</p>
    <p>{{ error() }}</p>
  </div>
</div>
