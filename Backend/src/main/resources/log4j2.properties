# Root logger - OFF (block everything: Hibernate, Spring, HikariCP, etc.)
rootLogger.level = off

# -------------------------------------------------------
# SERVICE LAYER - com.example.service (INFO and above)
# -------------------------------------------------------
logger.service.name = com.example.service
logger.service.level = info
logger.service.additivity = false
logger.service.appenderRefs = appLog, exceptionLog
logger.service.appenderRef.appLog.ref = appLog
logger.service.appenderRef.exceptionLog.ref = exceptionLog

# -------------------------------------------------------
# EXCEPTION HANDLER - com.example.exception (ERROR only)
# -------------------------------------------------------
logger.exception.name = com.example.exception
logger.exception.level = error
logger.exception.additivity = false
logger.exception.appenderRefs = appLog, exceptionLog
logger.exception.appenderRef.appLog.ref = appLog
logger.exception.appenderRef.exceptionLog.ref = exceptionLog

# -------------------------------------------------------
# APP LOG - stores INFO and above (all sessions)
# -------------------------------------------------------
appender.appLog.type = RollingFile
appender.appLog.name = appLog
appender.appLog.fileName = D:/logs/app.log
appender.appLog.filePattern = D:/logs/archive/app-%d{yyyy-MM-dd}-%i.log.gz
appender.appLog.layout.type = PatternLayout
appender.appLog.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c - %m%n
appender.appLog.policies.type = Policies
appender.appLog.policies.startup.type = OnStartupTriggeringPolicy
appender.appLog.policies.size.type = SizeBasedTriggeringPolicy
appender.appLog.policies.size.size = 10MB
appender.appLog.strategy.type = DefaultRolloverStrategy
appender.appLog.strategy.max = 30

# -------------------------------------------------------
# EXCEPTION LOG - stores ERROR only (separate file)
# -------------------------------------------------------
appender.exceptionLog.type = RollingFile
appender.exceptionLog.name = exceptionLog
appender.exceptionLog.fileName = D:/logs/exceptions.log
appender.exceptionLog.filePattern = D:/logs/archive/exceptions-%d{yyyy-MM-dd}-%i.log.gz
appender.exceptionLog.layout.type = PatternLayout
appender.exceptionLog.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c - %m%n
appender.exceptionLog.filter.threshold.type = ThresholdFilter
appender.exceptionLog.filter.threshold.level = error
appender.exceptionLog.filter.threshold.onMatch = ACCEPT
appender.exceptionLog.filter.threshold.onMismatch = DENY
appender.exceptionLog.policies.type = Policies
appender.exceptionLog.policies.startup.type = OnStartupTriggeringPolicy
appender.exceptionLog.policies.size.type = SizeBasedTriggeringPolicy
appender.exceptionLog.policies.size.size = 10MB
appender.exceptionLog.strategy.type = DefaultRolloverStrategy
appender.exceptionLog.strategy.max = 30